<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HITUNGAN NERAKA MARUT EDITION</title>
<style>
* {box-sizing:border-box}
body {
  margin:0;
  padding:15px 10px 50px 10px;
  background:linear-gradient(180deg, #0a0a0a 0%, #1a0f0a 100%);
  font-family:Arial, sans-serif;
  touch-action:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
  color:white;
}

.header {
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:12px;
  width:100%;
  max-width:400px;
}

#fotoProfil {
  width:65px;
  height:65px;
  border-radius:50%;
  border:3px solid #ff4444;
  object-fit:cover;
  background:#333;
  box-shadow:0 0 15px rgba(255,68,68,0.6);
  margin-bottom:8px;
}

h1 {
  color:#ff3333;
  font-size:28px;
  margin:0;
  font-weight:900;
  text-shadow:0 0 12px #ff0000;
  text-align:center;
}

#curhat {
  color:#ffcc00;
  font-size:16px;
  margin:5px 0 8px 0;
  font-weight:bold;
  text-align:center;
  text-shadow:0 0 5px #ff0000;
}

#hint {
  color:#ff0000;
  font-size:14px;
  margin-bottom:8px;
  text-align:center;
  font-weight:900;
  background:#330000;
  padding:6px 12px;
  border-radius:5px;
  border:2px solid #ff4444;
}

#info {
  color:#ffcc00;
  font-size:13px;
  margin-bottom:10px;
  text-align:center;
  font-weight:bold;
}

.scoreBox {
  display:flex;
  gap:10px;
  margin-bottom:12px;
}

.score {
  background:#660000;
  color:#ffcc00;
  padding:8px 18px;
  border-radius:5px;
  font-weight:900;
  font-size:14px;
  border:2px solid #ff4444;
  text-align:center;
  min-width:75px;
}

/* INI KUNCINYA BOS - RESPONSIVE BUAT HP + LAPTOP */
#game {
  width:320px; /* DEFAULT BUAT LAPTOP */
  height:320px;
  max-width:90vw; /* DI HP NGIKUTIN LAYAR */
  max-height:90vw;
  background:#222;
  border-radius:8px;
  padding:10px;
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  grid-template-rows:repeat(4, 1fr);
  gap:10px;
  border:4px solid #444;
  box-shadow:0 0 25px rgba(255,68,68,0.4);
}

.cell {
  background:#333;
  border-radius:5px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px; /* LAPTOP */
  font-weight:900;
  color:white;
  transition:all 0.15s;
}

/* KALO LAYAR KECIL, FONT OTOMATIS KECIL */
@media (max-width: 400px) {
 .cell {
    font-size:7vw;
  }
  h1 {font-size:24px}
  #fotoProfil {width:55px; height:55px}
}

.tile-2 {background:#eee; color:#666}.tile-4 {background:#eee4da; color:#666}.tile-8 {background:#f2b179; color:white}
.tile-16 {background:#f59563; color:white}.tile-32 {background:#f67c5f; color:white}.tile-64 {background:#f65e3b; color:white}
.tile-128 {background:#edcf72; color:white; font-size:28px}.tile-256 {background:#edcc61; color:white; font-size:28px}
.tile-512 {background:#edc850; color:white; font-size:28px}.tile-1024 {background:#edc53f; color:white; font-size:22px}
.tile-2048 {background:#edc22e; color:white; font-size:22px; box-shadow:0 0 20px #ffcc00}

.btnBox {
  margin-top:12px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
}

button {
  padding:10px 20px;
  background:#8b0000;
  color:#ffcc00;
  border:2px solid #ff4444;
  border-radius:5px;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
}

button:active {transform:scale(0.95)}
button:disabled {opacity:0.5}

#uploadBox {margin-bottom:10px}
#uploadBox label {
  background:#660000;
  color:#ffcc00;
  padding:6px 12px;
  border-radius:5px;
  border:2px solid #ff4444;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
}
#uploadBox input[type=file] {display:none}

#msg {
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.95);
  padding:30px 20px;
  border-radius:12px;
  text-align:center;
  display:none;
  z-index:100;
  border:3px solid #ff4444;
  box-shadow:0 0 30px rgba(255,68,68,0.8);
  width:85vw;
  max-width:300px;
}
#msg h2 {color:#ff4444; font-size:30px; margin:0 0 8px 0; text-shadow:0 0 10px #ff0000}
#msg p {color:#ffcc00; font-size:16px; margin:4px 0; font-weight:bold}

/* HAK CIPTA UDAH GUE FIX BOS */
#footer {
  color:#ff4444;
  font-size:12px;
  margin-top:25px;
  font-weight:bold;
  text-align:center;
  text-shadow:0 0 6px #ff0000;
  opacity:0.9;
  letter-spacing:1px;
  width:100%;
}
</style>
</head>
<body>

<div class="header">
  <img id="fotoProfil" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23333'/%3E%3Ctext x='50' y='60' text-anchor='middle' font-size='40' fill='%23666'%3E%3F%3C/text%3E%3C/svg%3E">
  <h1>HITUNGAN NERAKA</h1>
</div>

<div id="curhat">MATEMATIKA ITU MUDAH<br>KATA ORANG BUKAN SAYA</div>

<div id="uploadBox">
  <label for="inputFoto">📸 GANTI FOTO</label>
  <input type="file" id="inputFoto" accept="image/*">
</div>


<div id="info">Geser: ↑↓←→ atau swipe. Gabungin angka yg sama!</div>

<div class="scoreBox">
  <div class="score">SKOR<br><span id="skor">0</span></div>
  <div class="score">BEST<br><span id="best">0</span></div>
</div>

<div id="game"></div>

<div id="msg">
  <h2>GAME OVER BOS</h2>
  <p>belajar hitung lagi ya</p>
  <p style="font-size:12px; opacity:0.8">buatan ADRIANUS MARUT 2026</p>
  <button onclick="restart()" style="margin-top:12px">🔄 MAIN LAGI</button>
</div>

<div class="btnBox">

  <button onclick="restart()">🔄 RESTART</button>
</div>

<div id="footer">&copy; 2026 ADRIANUS MARUT | MARUT EDITION 🔥</div>

<script>
let board = [];
let skor = 0;
let best = parseInt(localStorage.getItem('best2048marut') || 0);
let audioCtx = null;
document.getElementById('best').innerText = best;

let fotoSimpan = localStorage.getItem('fotoProfilMarut');
if(fotoSimpan) document.getElementById('fotoProfil').src = fotoSimpan;

document.getElementById('inputFoto').addEventListener('change', function(e){
  let file = e.target.files[0];
  if(file){
    let reader = new FileReader();
    reader.onload = function(event){
      document.getElementById('fotoProfil').src = event.target.result;
      localStorage.setItem('fotoProfilMarut', event.target.result);
    }
    reader.readAsDataURL(file);
  }
});



function playBeep(freq, dur){
  if(!audioCtx) return;
  let osc = audioCtx.createOscillator();
  let gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + dur);
  if(navigator.vibrate) navigator.vibrate(40);
}

function init(){
  board = Array(4).fill().map(()=>Array(4).fill(0));
  skor = 0;
  document.getElementById('msg').style.display = 'none';
  updateSkor();
  addTile();
  addTile();
  draw();
}

function addTile(){
  let kosong = [];
  for(let i=0; i<4; i++) for(let j=0; j<4; j++) if(board[i][j]==0) kosong.push([i,j]);
  if(kosong.length>0){
    let [i,j] = kosong[Math.floor(Math.random()*kosong.length)];
    board[i][j] = Math.random()<0.9? 2 : 4;
  }
}

function draw(){
  let game = document.getElementById('game');
  game.innerHTML = '';
  for(let i=0; i<4; i++){
    for(let j=0; j<4; j++){
      let div = document.createElement('div');
      div.className = 'cell';
      if(board[i][j]>0){
        div.innerText = board[i][j];
        div.classList.add('tile-'+board[i][j]);
      }
      game.appendChild(div);
    }
  }
}

function geser(baris){
  let baru = baris.filter(x=>x>0);
  let adaMerge = false;
  for(let i=0; i<baru.length-1; i++){
    if(baru[i]==baru[i+1]){
      baru[i] *= 2;
      skor += baru[i];
      baru.splice(i+1,1);
      adaMerge = true;
    }
  }
  while(baru.length<4) baru.push(0);
  return {baris:baru, merge:adaMerge};
}

function move(arah){
  let bLama = JSON.stringify(board);
  let adaMergeGlobal = false;

  if(arah=='kiri'){
    for(let i=0; i<4; i++){
      let hasil = geser(board[i]);
      board[i] = hasil.baris;
      if(hasil.merge) adaMergeGlobal = true;
    }
  }
  if(arah=='kanan'){
    for(let i=0; i<4; i++){
      let hasil = geser(board[i].reverse());
      board[i] = hasil.baris.reverse();
      if(hasil.merge) adaMergeGlobal = true;
    }
  }
  if(arah=='atas'){
    for(let j=0; j<4; j++){
      let col = [board[0][j],board[1][j],board[2][j],board[3][j]];
      let hasil = geser(col);
      for(let i=0; i<4; i++) board[i][j] = hasil.baris[i];
      if(hasil.merge) adaMergeGlobal = true;
    }
  }
  if(arah=='bawah'){
    for(let j=0; j<4; j++){
      let col = [board[0][j],board[1][j],board[2][j],board[3][j]].reverse();
      let hasil = geser(col);
      for(let i=0; i<4; i++) board[i][j] = hasil.baris.reverse()[i];
      if(hasil.merge) adaMergeGlobal = true;
    }
  }

  if(JSON.stringify(board)!=bLama){
    addTile();
    updateSkor();
    draw();
    if(adaMergeGlobal) playBeep(600, 0.08);
    cekGameOver();
  }
}

function updateSkor(){
  document.getElementById('skor').innerText = skor;
  if(skor>best){
    best = skor;
    localStorage.setItem('best2048marut', best);
    document.getElementById('best').innerText = best;
  }
}

function cekGameOver(){
  let penuh = true;
  let bisaMerge = false;
  for(let i=0; i<4; i++) for(let j=0; j<4; j++){
    if(board[i][j]==0) penuh=false;
    if(i<3 && board[i][j]==board[i+1][j]) bisaMerge=true;
    if(j<3 && board[i][j]==board[i][j+1]) bisaMerge=true;
  }
  if(penuh &&!bisaMerge){
    document.getElementById('msg').style.display = 'block';
  }
}

function restart(){ init(); }

document.addEventListener('keydown', e=>{
  if(e.key=='ArrowLeft') move('kiri');
  if(e.key=='ArrowRight') move('kanan');
  if(e.key=='ArrowUp') move('atas');
  if(e.key=='ArrowDown') move('bawah');
});

let startX, startY;
document.getElementById('game').addEventListener('touchstart', e=>{
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
});
document.getElementById('game').addEventListener('touchend', e=>{
  let dx = e.changedTouches[0].clientX - startX;
  let dy = e.changedTouches[0].clientY - startY;
  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>30) move('kanan');
    if(dx<-30) move('kiri');
  } else {
    if(dy>30) move('bawah');
    if(dy<-30) move('atas');
  }
});
let board = [];
let skor = 0;
let best = parseInt(localStorage.getItem('best2048marut') || 0);
document.getElementById('best').innerText = best;

// LOAD FOTO
let fotoSimpan = localStorage.getItem('fotoProfilMarut');
if(fotoSimpan) document.getElementById('fotoProfil').src = fotoSimpan;

// UPLOAD FOTO
document.getElementById('inputFoto').addEventListener('change', function(e){
  let file = e.target.files[0];
  if(file){
    let reader = new FileReader();
    reader.onload = function(event){
      document.getElementById('fotoProfil').src = event.target.result;
      localStorage.setItem('fotoProfilMarut', event.target.result);
    }
    reader.readAsDataURL(file);
  }
});

      }

  }
}

  for(let i=0; i<baru.length-1; i++){

    }
  }
  while(baru.length<4) baru.push(0);
  return baru;
}

function move(arah){
  let berubah = false;
  let bLama = JSON.stringify(board);

  if(arah=='kiri'){
    for(let i=0; i<4; i++) board[i] = geser(board[i]);
  }
  if(arah=='kanan'){
    for(let i=0; i<4; i++) board[i] = geser(board[i].reverse()).reverse();
  }
  if(arah=='atas'){
    for(let j=0; j<4; j++){
      let col = [board[0][j],board[1][j],board[2][j],board[3][j]];
      col = geser(col);
      for(let i=0; i<4; i++) board[i][j] = col[i];
    }
  }
  if(arah=='bawah'){
    for(let j=0; j<4; j++){
      let col = [board[0][j],board[1][j],board[2][j],board[3][j]].reverse();
      col = geser(col).reverse();
      for(let i=0; i<4; i++) board[i][j] = col[i];
    }
  }

  if(JSON.stringify(board)!=bLama){
    addTile();
    updateSkor();
    draw();
    cekGameOver();
  }
}

  document.getElementById('skor').innerText = skor;
  if(skor>best){
    best = skor;
    localStorage.setItem('best2048marut', best);
    document.getElementById('best').innerText = best;
  }
}

    if(i<3 && board[i][j]==board[i+1][j]) bisaMerge=true;
    if(j<3 && board[i][j]==board[i][j+1]) bisaMerge=true;
  }

  if(penuh &&!bisaMerge){
    document.getElementById('msgText').innerText = 'GAME OVER BOS';
    document.getElementById('msgSub').innerText = 'belajar hitung lagi ya';
    document.getElementById('msg').style.display = 'block';
  }
}

function restart(){ init(); }

</script>
